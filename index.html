<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My AI</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f7f7f8;
        }

        header {
            background: #202123;
            color: white;
            padding: 18px;
            text-align: center;
            font-size: 24px;
            font-weight: bold;
        }

        #chat {
            max-width: 800px;
            margin: 20px auto;
            padding: 10px;
        }

        .message {
            padding: 14px;
            margin: 10px 0;
            border-radius: 10px;
            line-height: 1.5;
        }

        .user {
            background: #dbeafe;
            text-align: right;
        }

        .ai {
            background: white;
            border: 1px solid #ddd;
        }

        #inputArea {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: white;
            padding: 15px;
            display: flex;
            gap: 10px;
            box-shadow: 0 -2px 10px #ddd;
        }

        #question {
            flex: 1;
            padding: 13px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 16px;
        }

        button {
            padding: 13px 20px;
            border: none;
            border-radius: 8px;
            background: #202123;
            color: white;
            cursor: pointer;
        }
    </style>
</head>

<body>

<header>My AI</header>

<div id="chat">
    <div class="message ai">
        Hello! 👋 I am your AI assistant. Ask me anything.
    </div>
</div>

<div id="inputArea">
    <input id="question" type="text" placeholder="Message My AI...">
    <button onclick="sendMessage()">Send</button>
</div>

<script>
function sendMessage() {
    const input = document.getElementById("question");
    const question = input.value.trim();

    if (question === "") return;

    const chat = document.getElementById("chat");

    const userMessage = document.createElement("div");
    userMessage.className = "message user";
    userMessage.textContent = question;
    chat.appendChild(userMessage);

    const aiMessage = document.createElement("div");
    aiMessage.className = "message ai";
    aiMessage.textContent = "I received your message: " + question;
    chat.appendChild(aiMessage);

    input.value = "";
}
</script>

</body>
</html>
